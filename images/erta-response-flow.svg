<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 1220" width="1100" height="1220" role="img" aria-labelledby="erta-title erta-desc"><title id="erta-title">ERTA: considering responses to a threat</title><desc id="erta-desc">A top-down flowchart that starts from a threat and asks four questions in order. First: can it be eliminated? If yes, the feature or condition is removed, with the rationale and specification reference documented, and that branch ends. If no, ask whether a control can reduce it. If yes, normative text or a reference states the control, the enforcing actor and the failure behavior. After reduction, or if reduction is not possible, ask whether protection is delegated, even partly, to another actor. If yes, document the transfer by naming the recipient and the assigned responsibility, noting that the text may be non-normative, then document the assumption that the recipient applies the assigned protection with its rationale, and the flow continues to the remaining threat, original or residual. If not delegated, the flow goes directly to the remaining threat. Last: is the remaining threat acceptable? If yes, the accepted threat is documented with rationale and review conditions. If no, the Group iterates on the model and responses, and a dashed arrow returns to the start.</desc><rect width="1100" height="1220" fill="#fff" /><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#000" /></marker></defs><style>text { font-family: Arial, sans-serif; fill: #000; } .edge { fill: none; stroke: #000; stroke-width: 2.2; stroke-linejoin: miter; stroke-linecap: square; } .shape { fill: #fff; stroke: #000; stroke-width: 2.2; } .response { stroke-width: 2.8; }</style><text x="200" y="28" text-anchor="middle" font-size="16" font-weight="700">Question</text><text x="460" y="28" text-anchor="middle" font-size="16" font-weight="700">Response</text><text x="840" y="28" text-anchor="middle" font-size="16" font-weight="700">Documented in the specification</text><g id="connections"><path d="M 200 101 L 200 133" class="edge" marker-end="url(#arrow)" data-edge="START-QE" /><path d="M 330 185 L 385 185" class="edge" marker-end="url(#arrow)" data-edge="QE-E" /><path d="M 535 185 L 631 185" class="edge" marker-end="url(#arrow)" data-edge="E-EO" /><path d="M 200 237 L 200 309" class="edge" marker-end="url(#arrow)" data-edge="QE-QR" /><path d="M 330 365 L 385 365" class="edge" marker-end="url(#arrow)" data-edge="QR-R" /><path d="M 535 365 L 631 365" class="edge" marker-end="url(#arrow)" data-edge="R-RO" /><path d="M 200 421 L 200 530" class="edge" marker-end="url(#arrow)" data-edge="QR-QT" /><path d="M 840 416 L 840 468 L 200 468 L 200 530" class="edge" marker-end="url(#arrow)" data-edge="RO-QT" /><path d="M 360 610 L 385 610" class="edge" marker-end="url(#arrow)" data-edge="QT-T" /><path d="M 535 610 L 631 610" class="edge" marker-end="url(#arrow)" data-edge="T-TDOC" /><path d="M 840 666 L 840 694" class="edge" marker-end="url(#arrow)" data-edge="TDOC-ASS" /><path d="M 460 636 L 460 726 L 200 726 L 200 761" class="edge" marker-end="url(#arrow)" data-edge="T-RES" /><path d="M 200 690 L 200 761" class="edge" marker-end="url(#arrow)" data-edge="QT-RES" /><path d="M 200 839 L 200 900" class="edge" marker-end="url(#arrow)" data-edge="RES-QA" /><path d="M 340 960 L 385 960" class="edge" marker-end="url(#arrow)" data-edge="QA-A" /><path d="M 535 960 L 631 960" class="edge" marker-end="url(#arrow)" data-edge="A-AO" /><path d="M 200 1020 L 200 1084" class="edge" marker-end="url(#arrow)" data-edge="QA-ITER" /><path d="M 200 1156 L 200 1190 L 24 1190 L 24 80 L 135 80" class="edge" marker-end="url(#arrow)" data-edge="ITER-START" stroke-dasharray="6 6" /></g><rect x="340" y="155" width="34" height="22" fill="#fff" /><text x="357" y="170" text-anchor="middle" font-size="16" font-weight="700">Yes</text><rect x="203" y="263" width="34" height="22" fill="#fff" /><text x="220" y="278" text-anchor="middle" font-size="16" font-weight="700">No</text><rect x="340" y="335" width="34" height="22" fill="#fff" /><text x="357" y="350" text-anchor="middle" font-size="16" font-weight="700">Yes</text><rect x="203" y="435" width="34" height="22" fill="#fff" /><text x="220" y="450" text-anchor="middle" font-size="16" font-weight="700">No</text><rect x="352" y="563" width="34" height="22" fill="#fff" /><text x="369" y="578" text-anchor="middle" font-size="16" font-weight="700">Yes</text><rect x="203" y="700" width="34" height="22" fill="#fff" /><text x="220" y="715" text-anchor="middle" font-size="16" font-weight="700">No</text><rect x="345" y="930" width="34" height="22" fill="#fff" /><text x="362" y="945" text-anchor="middle" font-size="16" font-weight="700">Yes</text><rect x="203" y="1041" width="34" height="22" fill="#fff" /><text x="220" y="1056" text-anchor="middle" font-size="16" font-weight="700">No</text><g id="nodes"><g id="START" data-shape="start"><rect x="135.0" y="59.0" width="130" height="42" class="shape" rx="21" /><text x="200" y="80.0" text-anchor="middle" dominant-baseline="middle" font-size="18" font-weight="400">Threat</text></g><g id="QE" data-shape="decision"><polygon points="200,133.0 330.0,185 200,237.0 70.0,185" class="shape" /><text x="200" y="185.0" text-anchor="middle" dominant-baseline="middle" font-size="18" font-weight="400">Can I eliminate it?</text></g><g id="E" data-shape="response"><rect x="385.0" y="159.0" width="150" height="52" class="shape response" /><text x="460" y="185.0" text-anchor="middle" dominant-baseline="middle" font-size="21" font-weight="700">ELIMINATE</text></g><g id="EO" data-shape="output"><polygon points="642.0,142.0 1060.0,142.0 1038.0,228.0 620.0,228.0" class="shape" /><text x="840" y="173.5" text-anchor="middle" dominant-baseline="middle" font-size="18" font-weight="400">Feature or condition removed:</text><text x="840" y="196.5" text-anchor="middle" dominant-baseline="middle" font-size="18" font-weight="400">rationale and specification reference</text></g><g id="QR" data-shape="decision"><polygon points="200,309.0 330.0,365 200,421.0 70.0,365" class="shape" /><text x="200" y="353.5" text-anchor="middle" dominant-baseline="middle" font-size="18" font-weight="400">Can I reduce it</text><text x="200" y="376.5" text-anchor="middle" dominant-baseline="middle" font-size="18" font-weight="400">with a control?</text></g><g id="R" data-shape="response"><rect x="385.0" y="339.0" width="150" height="52" class="shape response" /><text x="460" y="365.0" text-anchor="middle" dominant-baseline="middle" font-size="21" font-weight="700">REDUCE</text></g><g id="RO" data-shape="output"><polygon points="642.0,314.0 1060.0,314.0 1038.0,416.0 620.0,416.0" class="shape" /><text x="840" y="342.0" text-anchor="middle" dominant-baseline="middle" font-size="18" font-weight="400">Normative text or reference:</text><text x="840" y="365.0" text-anchor="middle" dominant-baseline="middle" font-size="18" font-weight="400">control, enforcing actor,</text><text x="840" y="388.0" text-anchor="middle" dominant-baseline="middle" font-size="18" font-weight="400">and failure behavior</text></g><g id="QT" data-shape="decision"><polygon points="200,530.0 360.0,610 200,690.0 40.0,610" class="shape" /><text x="200" y="587.0" text-anchor="middle" dominant-baseline="middle" font-size="18" font-weight="400">Do I delegate protection,</text><text x="200" y="610.0" text-anchor="middle" dominant-baseline="middle" font-size="18" font-weight="400">even partly,</text><text x="200" y="633.0" text-anchor="middle" dominant-baseline="middle" font-size="18" font-weight="400">to another actor?</text></g><g id="T" data-shape="response"><rect x="385.0" y="584.0" width="150" height="52" class="shape response" /><text x="460" y="610.0" text-anchor="middle" dominant-baseline="middle" font-size="21" font-weight="700">TRANSFER</text></g><g id="TDOC" data-shape="output"><polygon points="642.0,554.0 1060.0,554.0 1038.0,666.0 620.0,666.0" class="shape" /><text x="840" y="575.5" text-anchor="middle" dominant-baseline="middle" font-size="18" font-weight="400">DOCUMENT TRANSFER:</text><text x="840" y="598.5" text-anchor="middle" dominant-baseline="middle" font-size="18" font-weight="400">Name the recipient and the assigned</text><text x="840" y="621.5" text-anchor="middle" dominant-baseline="middle" font-size="18" font-weight="400">responsibility. Text may be</text><text x="840" y="644.5" text-anchor="middle" dominant-baseline="middle" font-size="18" font-weight="400">non-normative</text></g><g id="ASS" data-shape="output"><polygon points="642.0,694.0 1060.0,694.0 1038.0,806.0 620.0,806.0" class="shape" /><text x="840" y="715.5" text-anchor="middle" dominant-baseline="middle" font-size="18" font-weight="400">DOCUMENT ASSUMPTION:</text><text x="840" y="738.5" text-anchor="middle" dominant-baseline="middle" font-size="18" font-weight="400">Recipient applies the assigned</text><text x="840" y="761.5" text-anchor="middle" dominant-baseline="middle" font-size="18" font-weight="400">protection. Explain the supporting</text><text x="840" y="784.5" text-anchor="middle" dominant-baseline="middle" font-size="18" font-weight="400">rationale</text></g><g id="RES" data-shape="output"><polygon points="72.0,761.0 350.0,761.0 328.0,839.0 50.0,839.0" class="shape" /><text x="200" y="788.5" text-anchor="middle" dominant-baseline="middle" font-size="18" font-weight="400">Remaining threat:</text><text x="200" y="811.5" text-anchor="middle" dominant-baseline="middle" font-size="18" font-weight="400">original or residual</text></g><g id="QA" data-shape="decision"><polygon points="200,900.0 340.0,960 200,1020.0 60.0,960" class="shape" /><text x="200" y="948.5" text-anchor="middle" dominant-baseline="middle" font-size="18" font-weight="400">Is the remaining threat</text><text x="200" y="971.5" text-anchor="middle" dominant-baseline="middle" font-size="18" font-weight="400">acceptable?</text></g><g id="A" data-shape="response"><rect x="385.0" y="934.0" width="150" height="52" class="shape response" /><text x="460" y="960.0" text-anchor="middle" dominant-baseline="middle" font-size="21" font-weight="700">ACCEPT</text></g><g id="AO" data-shape="output"><polygon points="642.0,914.0 1060.0,914.0 1038.0,1006.0 620.0,1006.0" class="shape" /><text x="840" y="948.5" text-anchor="middle" dominant-baseline="middle" font-size="18" font-weight="400">Accepted threat:</text><text x="840" y="971.5" text-anchor="middle" dominant-baseline="middle" font-size="18" font-weight="400">rationale and review conditions</text></g><g id="ITER" data-shape="action"><rect x="70.0" y="1084.0" width="260" height="72" class="shape" /><text x="200" y="1108.5" text-anchor="middle" dominant-baseline="middle" font-size="18" font-weight="400">Iterate: revise</text><text x="200" y="1131.5" text-anchor="middle" dominant-baseline="middle" font-size="18" font-weight="400">model and responses</text></g></g></svg>